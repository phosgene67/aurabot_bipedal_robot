[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-aurabot"
version = "1.1.0"
license = "Apache-2.0"
description = "Reinforcement learning environments for the AuraBot robot based on MjLab."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    "onnxruntime",
    "scipy>=1.17.1",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    
]

[project.entry-points."mjlab.tasks"]
mjlab_aurabot = "mjlab_aurabot.tasks"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
